<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>pag1</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
        <body class="bg-yellow-200 text-stone-800">  
            <main class="mx-auto grid max-w-4xl grid-cols-1 gap-4 p-4">
                <section class="flex h-32 items-center justify-center bg-white shadow">
                    <h1 class="text-2xl font-bold"></h1>
                </section>

                <section class="flex h-32 items-center justify-center bg-white shadow">
                    <h2 class="text-2xl font-bold"></h2>
                </section>

                <section class="flex h-32 items-center justify-center bg-white shadow">
                    <h2 class="text-2xl font-bold"></h2>
                </section>
                <section class="bg-white p-4 shadow">
                    <div class="grid grid-cols-3 grid-rows-2 gap-4">
                    <figure>
                        <img src="https://picsum.photos/seed/uno/400/300" alt="Imagen con blur"class="mx-auto aspect-square w-full max-w-40 rounded-full object-cover blur-sm">
                    <figcaption class="mt-1 text-center text-sm">blur</figcaption>
                    </figure>
                    <figure>
                        <img src="https://picsum.photos/seed/dos/400/300" alt="Imagen con transparencia"class="mx-auto aspect-square w-full max-w-40 rounded-full object-cover opacity-60">
                        <figcaption class="mt-1 text-center text-sm">transparencia</figcaption>
                    </figure>
                    <figure>
                        <img src="https://picsum.photos/seed/tres/400/300" alt="Imagen en escala de grises"class="mx-auto aspect-square w-full max-w-40 rounded-full object-cover grayscale">
                    <figcaption class="mt-1 text-center text-sm">escala de grises</figcaption>
                    </figure>

                    <figure>
                        <img src="https://picsum.photos/seed/cuatro/400/300" alt="Imagen con intensidad de color" class="h-40 w-full object-cover saturate-200">
                        <figcaption class="mt-1 text-center text-sm">intensidad de color</figcaption>
                    </figure>

                    <figure>
                            <img src="https://picsum.photos/seed/cinco/400/300" alt="Imagen con opacidad" class="h-40 w-full object-cover opacity-30">
                        <figcaption class="mt-1 text-center text-sm">opacidad</figcaption>
                    </figure>
                    <figure>
                            <img src="https://picsum.photos/seed/seis/400/300" alt="Imagen sin modificar" class="h-40 w-full object-cover">
                            <figcaption class="mt-1 text-center text-sm">sin modificar</figcaption>
                    </figure>

                    </div>
            </section>
            <section class="flex h-32 items-center justify-center bg-white shadow">
                <h2 class="text-2xl font-bold">Diseñado por: Maria Valentina Toconas Chavez</h2>
            </section>
      </main>

</body>
</html>
